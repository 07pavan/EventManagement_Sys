<!DOCTYPE html>
<html lang="en" class="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Register — GoAttend</title>
<meta name="description" content="Create your GoAttend account as an attendee or event organizer."/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script>tailwind.config={theme:{extend:{colors:{"primary":"#630ed4","primary-container":"#7c3aed","on-primary":"#ffffff","secondary":"#6e4db8","surface":"#fef7ff","on-surface":"#1d1a24","surface-variant":"#e8dfee","on-surface-variant":"#4a4455","outline":"#7b7487","outline-variant":"#ccc3d8","background":"#fef7ff","surface-container-lowest":"#ffffff","surface-container-low":"#f8f0ff","error":"#ba1a1a"},spacing:{"xs":"4px","sm":"8px","md":"16px","lg":"24px","xl":"48px","gutter":"16px","margin-mobile":"20px"},borderRadius:{DEFAULT:"1rem",lg:"2rem",full:"9999px"},fontSize:{"display-xl":["48px",{lineHeight:"1.1",letterSpacing:"-0.02em",fontWeight:"800"}],"headline-lg":["32px",{lineHeight:"1.2",fontWeight:"800"}],"headline-md":["24px",{lineHeight:"1.3",fontWeight:"700"}],"body-md":["16px",{lineHeight:"1.5",fontWeight:"400"}],"label-caps":["12px",{lineHeight:"1.0",letterSpacing:"0.05em",fontWeight:"600"}]}}}}</script>
<style>
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
body{font-family:'Inter',sans-serif}
.brand-logo{font-family:'Space Grotesk',sans-serif;font-weight:800;letter-spacing:-0.03em}
.glass-card{background:rgba(255,255,255,.4);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.3)}
.glow-focus:focus-within{box-shadow:0 0 15px rgba(124,58,237,.25)}
.vibe-gradient{background:linear-gradient(135deg,#7c3aed 0%,#630ed4 100%)}
.role-btn{transition:all .2s ease;cursor:pointer;border:2px solid transparent}
.role-btn.active-attendee{border-color:#630ed4;background:rgba(99,14,212,.08)}
.role-btn.active-organizer{border-color:#630ed4;background:rgba(99,14,212,.08)}
</style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col items-center relative overflow-x-hidden">

<!-- Background blurs -->
<div class="fixed inset-0 z-[-1] opacity-25 pointer-events-none overflow-hidden">
  <div class="absolute top-1/4 -left-20 w-64 h-64 bg-primary rounded-full blur-[100px]"></div>
  <div class="absolute bottom-1/4 -right-20 w-64 h-64 bg-secondary rounded-full blur-[100px]"></div>
</div>

<!-- Top nav -->
<nav class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl flex justify-between items-center px-margin-mobile h-16">
  <a href="index.html" class="brand-logo text-headline-md font-extrabold tracking-tighter text-primary">GoAttend</a>
  <div class="flex gap-md">
    <a href="index.html" class="text-label-caps text-on-surface-variant hover:text-primary transition-colors">Home</a>
    <a href="login.html" class="text-label-caps text-on-surface-variant hover:text-primary transition-colors">Login</a>
    <span class="text-label-caps text-primary border-b-2 border-primary pb-1">Register</span>
  </div>
</nav>

<!-- Main -->
<main class="flex-1 w-full max-w-md px-margin-mobile pt-28 pb-xl flex flex-col justify-center">
  <div class="glass-card rounded-xl p-lg shadow-[0_24px_48px_rgba(124,58,237,0.12)]">
    <header class="mb-lg">
      <h1 class="brand-logo text-headline-lg text-on-surface mb-xs">Join GoAttend</h1>
      <p class="text-body-md text-on-surface-variant">Create your account to discover and host events.</p>
    </header>

    <!-- Error -->
    <div id="err" class="hidden mb-md p-3 bg-red-50 border border-red-200 text-red-700 rounded-xl text-sm"></div>
    <!-- Success -->
    <div id="success" class="hidden mb-md p-4 bg-green-50 border border-green-200 text-green-700 rounded-xl text-sm text-center">
      <span class="material-symbols-outlined text-green-600 mb-1 block">check_circle</span>
      <p class="font-bold" id="success-title">Account created!</p>
      <p class="mt-1" id="success-msg">Redirecting to login...</p>
    </div>

    <form id="reg-form" class="space-y-md" onsubmit="doRegister(event)">

      <!-- Role Toggle -->
      <div class="space-y-xs">
        <label class="text-label-caps text-on-surface-variant ml-1">I WANT TO</label>
        <div class="grid grid-cols-2 gap-sm">
          <button type="button" id="role-attendee" onclick="selectRole('regular')"
            class="role-btn active-attendee rounded-xl p-md flex flex-col items-center gap-xs bg-surface-container-low">
            <span class="material-symbols-outlined text-primary text-3xl">confirmation_number</span>
            <span class="font-bold text-on-surface text-sm">Attend Events</span>
            <span class="text-xs text-on-surface-variant text-center">Discover &amp; buy tickets</span>
          </button>
          <button type="button" id="role-organizer" onclick="selectRole('organizer')"
            class="role-btn rounded-xl p-md flex flex-col items-center gap-xs bg-surface-container-low">
            <span class="material-symbols-outlined text-primary text-3xl">event</span>
            <span class="font-bold text-on-surface text-sm">Host Events</span>
            <span class="text-xs text-on-surface-variant text-center">Create &amp; manage events</span>
          </button>
        </div>
        <input type="hidden" id="r-role" value="regular"/>
      </div>

      <!-- Username -->
      <div class="space-y-xs">
        <label class="text-label-caps text-on-surface-variant ml-1">USERNAME</label>
        <div class="relative glow-focus transition-all rounded-full">
          <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">person</span>
          <input id="r-username" type="text" required placeholder="your_username"
            class="w-full bg-surface-container-lowest border-2 border-outline-variant focus:border-primary focus:ring-0 rounded-full py-3 pl-12 pr-4 text-body-md placeholder:text-outline/50 transition-all"/>
        </div>
      </div>

      <!-- Email -->
      <div class="space-y-xs">
        <label class="text-label-caps text-on-surface-variant ml-1">EMAIL</label>
        <div class="relative glow-focus transition-all rounded-full">
          <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">mail</span>
          <input id="r-email" type="email" required placeholder="alex@example.com"
            class="w-full bg-surface-container-lowest border-2 border-outline-variant focus:border-primary focus:ring-0 rounded-full py-3 pl-12 pr-4 text-body-md placeholder:text-outline/50 transition-all"/>
        </div>
      </div>

      <!-- Password -->
      <div class="space-y-xs">
        <label class="text-label-caps text-on-surface-variant ml-1">PASSWORD</label>
        <div class="relative glow-focus transition-all rounded-full">
          <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">lock</span>
          <input id="r-pass" type="password" required placeholder="Min 8 characters"
            class="w-full bg-surface-container-lowest border-2 border-outline-variant focus:border-primary focus:ring-0 rounded-full py-3 pl-12 pr-4 text-body-md border-2 transition-all"/>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="space-y-xs">
        <label class="text-label-caps text-on-surface-variant ml-1">CONFIRM PASSWORD</label>
        <div class="relative glow-focus transition-all rounded-full">
          <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">verified_user</span>
          <input id="r-pass2" type="password" required placeholder="Repeat password"
            class="w-full bg-surface-container-lowest border-2 border-outline-variant focus:border-primary focus:ring-0 rounded-full py-3 pl-12 pr-4 text-body-md border-2 transition-all"/>
        </div>
      </div>

      <!-- Security Question -->
      <div class="space-y-xs">
        <label class="text-label-caps text-on-surface-variant ml-1">SECURITY QUESTION</label>
        <div class="relative glow-focus transition-all rounded-full">
          <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">help</span>
          <select id="r-security-question" required
            class="w-full bg-surface-container-lowest border-2 border-outline-variant focus:border-primary focus:ring-0 rounded-full py-3 pl-12 pr-4 text-body-md transition-all appearance-none">
            <option value="" disabled selected>Select a security question</option>
            <option value="first_pet">What was the name of your first pet?</option>
            <option value="mother_maiden">What is your mother's maiden name?</option>
            <option value="first_school">What was the name of your first school?</option>
            <option value="birth_city">In what city were you born?</option>
            <option value="favorite_movie">What is your favorite movie?</option>
          </select>
        </div>
      </div>

      <!-- Security Answer -->
      <div class="space-y-xs">
        <label class="text-label-caps text-on-surface-variant ml-1">SECURITY ANSWER</label>
        <div class="relative glow-focus transition-all rounded-full">
          <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">question_answer</span>
          <input id="r-security-answer" type="text" required placeholder="Your answer (case-insensitive)"
            class="w-full bg-surface-container-lowest border-2 border-outline-variant focus:border-primary focus:ring-0 rounded-full py-3 pl-12 pr-4 text-body-md placeholder:text-outline/50 transition-all"/>
        </div>
      </div>

      <!-- Submit -->
      <div class="pt-sm">
        <button type="submit" id="reg-btn"
          class="vibe-gradient w-full py-4 rounded-full text-on-primary font-bold text-headline-md shadow-xl active:scale-95 transition-transform">
          Create Account
        </button>
      </div>
    </form>

    <footer class="mt-xl text-center">
      <p class="text-body-md text-on-surface-variant">
        Already have an account?
        <a href="login.html" class="text-primary font-bold hover:underline">Log in</a>
      </p>
    </footer>
  </div>
</main>

<script src="config.js"></script>
<script src="api.js"></script>
<script>
function selectRole(role) {
  document.getElementById('r-role').value = role;
  const attBtn = document.getElementById('role-attendee');
  const orgBtn = document.getElementById('role-organizer');
  attBtn.classList.remove('active-attendee', 'active-organizer');
  orgBtn.classList.remove('active-attendee', 'active-organizer');
  if (role === 'regular') {
    attBtn.classList.add('active-attendee');
  } else {
    orgBtn.classList.add('active-organizer');
  }
}

async function doRegister(e) {
  e.preventDefault();
  const errEl  = document.getElementById('err');
  const succEl = document.getElementById('success');
  const btn    = document.getElementById('reg-btn');
  errEl.classList.add('hidden');
  succEl.classList.add('hidden');

  const username = document.getElementById('r-username').value.trim();
  const email    = document.getElementById('r-email').value.trim();
  const pass     = document.getElementById('r-pass').value;
  const pass2    = document.getElementById('r-pass2').value;
  const role     = document.getElementById('r-role').value;
  const question = document.getElementById('r-security-question').value;
  const answer   = document.getElementById('r-security-answer').value.trim();

  if (pass !== pass2) {
    errEl.textContent = 'Passwords do not match.';
    errEl.classList.remove('hidden');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Creating...';

  try {
    await register({
      username,
      email,
      password: pass,
      password2: pass2,
      role,
      security_question: question,
      security_answer: answer
    });
    const isOrg = role === 'organizer';
    document.getElementById('success-title').textContent = isOrg ? 'Organizer account created!' : 'Account created!';
    document.getElementById('success-msg').textContent   = isOrg ? 'Redirecting to login to access your dashboard...' : 'Redirecting to login...';
    succEl.classList.remove('hidden');
    document.getElementById('reg-form').classList.add('hidden');
    setTimeout(() => { window.location.href = 'login.html'; }, 2000);
  } catch(err) {
    errEl.textContent = (typeof extractErrorMessage === 'function')
      ? extractErrorMessage(err)
      : (err.detail || 'Registration failed.');
    errEl.classList.remove('hidden');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Create Account';
  }
}
</script>
</body>
</html>
